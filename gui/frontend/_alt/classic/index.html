<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FVPN</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="tabs" role="tablist">
  <button id="tabBtnConn" class="tab sel" role="tab">Bağlantılar</button>
  <button id="tabBtnLog" class="tab" role="tab">Günlük</button>
</div>

<!-- ===== Bağlantılar ===== -->
<div id="tabConn" class="tabpage">
  <div class="split">
    <div class="left">
      <div id="list" class="listbox" tabindex="0" role="listbox"></div>
      <div class="listbar">
        <button id="btnAdd" class="btn">Ekle</button>
        <button id="btnDel" class="btn">Sil</button>
      </div>
    </div>

    <div class="right">
      <div id="svcErr" class="errline" hidden></div>

      <p id="vEmpty" class="empty" hidden>Profil yok. Eklemek için <b>Ekle</b> düğmesini kullanın.</p>

      <!-- view / connect -->
      <div id="vView" hidden>
        <fieldset class="group">
          <legend id="gTitle"></legend>
          <div class="form">
            <div class="r"><label>Durum:</label><div><span id="stDot" class="dot"></span><span id="stText"></span></div></div>
            <div class="r"><label>Sunucu:</label><div id="vServer" class="sel-text"></div></div>
            <div class="r" id="rRealm"><label>Realm:</label><div id="vRealm"></div></div>
            <div class="r" id="rLastErr"><label>Son hata:</label><div id="vLastErr" class="err-text"></div></div>

            <div class="r" id="rUser"><label for="user">Kullanıcı adı:</label><input id="user" class="tb" autocomplete="username" spellcheck="false" maxlength="128"></div>
            <div class="r" id="rPass"><label for="pass">Parola:</label><input id="pass" class="tb" type="password" autocomplete="current-password" maxlength="512"></div>

            <div class="r" id="rChal"><label></label><div id="chalMsg"></div></div>
            <div class="r" id="rCode"><label for="code">Doğrulama kodu:</label><input id="code" class="tb tb-short" inputmode="numeric" autocomplete="one-time-code" maxlength="10" spellcheck="false"></div>
            <div class="r" id="rChalLeft"><label></label><div id="chalLeft" class="gray"></div></div>

            <div class="r" id="rIP"><label>IPv4 adresi:</label><div id="upIP" class="sel-text"></div></div>
            <div class="r" id="rUpUser"><label>Kullanıcı:</label><div id="upUser"></div></div>
            <div class="r" id="rFor"><label>Bağlantı süresi:</label><div id="upFor"></div></div>
          </div>
          <div id="formErr" class="errline" hidden></div>
          <div class="btnrow">
            <button id="btnPrimary" class="btn btn-def"></button>
            <button id="btnSecondary" class="btn"></button>
          </div>
        </fieldset>

        <fieldset id="gTunnel" class="group" hidden>
          <legend>Tünel</legend>
          <div class="form">
            <div class="r"><label>Rotalar:</label><div id="upRoutes"></div></div>
            <div class="r"><label>DNS sunucuları:</label><div id="upDNS" class="sel-text"></div></div>
            <div class="r"><label>Oturum sonu:</label><div id="upExp"></div></div>
            <div class="r"><label>Aktarım:</label><div id="upXfer"></div></div>
          </div>
        </fieldset>

        <div class="bottomright">
          <button id="btnCopy" class="btn" hidden>Kopyala</button>
          <button id="btnEdit" class="btn">Düzenle</button>
        </div>
      </div>

      <!-- edit -->
      <div id="vEdit" hidden>
        <fieldset class="group">
          <legend id="eTitle">Profil ekle</legend>
          <div class="form">
            <div class="r"><label for="eName">Ad:</label><input id="eName" class="tb" maxlength="64" spellcheck="false"></div>
            <div class="r"><label for="eServer">Sunucu:</label><input id="eServer" class="tb" maxlength="255" spellcheck="false" placeholder="vpn.example.com:10443"></div>
            <div class="r"><label for="eRealm">Realm:</label><input id="eRealm" class="tb tb-short" maxlength="64" spellcheck="false"></div>
            <div class="r"><label>Sertifika:</label><div class="inline"><span id="certState"></span><button id="btnCheckCert" class="btn">Kontrol et</button></div></div>
            <div class="r" id="rCertSub"><label>Verilen:</label><div id="certSubject" class="sel-text"></div></div>
            <div class="r" id="rCertIss"><label>Veren:</label><div id="certIssuer" class="sel-text"></div></div>
            <div class="r" id="rCertExp"><label>Son geçerlilik:</label><div id="certExpiry"></div></div>
            <div class="r" id="rCertFp"><label>SHA-256:</label><div id="certFp" class="sel-text mono"></div></div>
            <div class="r" id="rPin"><label></label><label class="chk"><input id="ePin" type="checkbox"> Bu sertifikaya güven</label></div>
          </div>
          <div id="editErr" class="errline" hidden></div>
        </fieldset>
        <div class="bottomright">
          <button id="btnSave" class="btn btn-def">Kaydet</button>
          <button id="btnCancelEdit" class="btn">İptal</button>
        </div>
      </div>
    </div>
  </div>

  <div class="footbar">
    <label class="chk"><input id="autostart" type="checkbox"> Oturum açılınca başlat</label>
  </div>
</div>

<!-- ===== Günlük ===== -->
<div id="tabLog" class="tabpage" hidden>
  <div class="logview">
    <table class="logtable">
      <thead><tr><th class="c-time">Zaman</th><th>Mesaj</th></tr></thead>
      <tbody id="logRows"></tbody>
    </table>
  </div>
  <div class="footbar">
    <span id="ver" class="gray"></span>
    <span class="spacer"></span>
    <button id="btnLogRefresh" class="btn">Yenile</button>
    <button id="btnLogCopy" class="btn">Kopyala</button>
  </div>
</div>

<!-- Message box -->
<div id="dlg" class="smoke" hidden>
  <div class="msgbox" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="msg-title" id="dlgTitle"></div>
    <div class="msg-body" id="dlgText"></div>
    <div class="msg-foot">
      <button id="dlgPrimary" class="btn btn-def"></button>
      <button id="dlgSecondary" class="btn"></button>
      <button id="dlgClose" class="btn">İptal</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
